# Enough heap for AGP + Kotlin + KSP; metaspace bump avoids OOM on the daemon.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX only; Jetifier off (no legacy support-lib deps).
android.useAndroidX=true
android.enableJetifier=false

# Kotlin incremental + official code style.
kotlin.code.style=official

# Only generate BuildConfig where we ask for it (per-module), not globally.
android.nonTransitiveRClass=true

# compileSdk 36 (Android 16) is newer than what AGP 8.9.1 was tested against
# (35), so AGP prints an "unsupported compileSdk" warning on every sync/build.
# The combination builds fine (verified); suppress the nag so it doesn't muddy
# the sync log. Drop this line if AGP is bumped to a version that supports 36.
# NB: opening this project still REQUIRES the Android 16 (API 36) SDK installed
# via SDK Manager + Android Studio Meerkat 2024.3.1+ (for AGP 8.9.1).
android.suppressUnsupportedCompileSdk=36

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
